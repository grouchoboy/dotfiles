# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font Mono"
font_size        16
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures   alway
text_composition_strategy platform
# END_KITTY_FONTS

hide_window_decorations yes
window_padding_width 5

tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1
tab_title_template "{session_name}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{tab.active_exe + ' ' if title[:1] not in ('~', '/', '…') else ''}{tab.active_wd.rsplit('/', 1)[-1] or tab.active_wd}"

enable_audio_bell no
cursor_blink_interval 0
cursor_shape block
shell_integration no-cursor
editor nvim

map f5 load_config_file

# BEGIN_KITTY_THEME
# Gruvbox Dark Soft
include current-theme.conf
# END_KITTY_THEME

allow_remote_control yes
session_directory ~/dotfiles/config/kitty/sessions
# map kitty_mod+alt+s save_as_session --use-foreground-process --relocatable --save-only --base-dir ~/.config/kitty/sessions
# kitty_mod=ctrl+shift
map kitty_mod+alt+s save_as_session --relocatable --use-foreground-process --base-dir ~/.config/kitty/sessions --match=session:. .
map kitty_mod+alt+r combine : close_session : goto_session ~/.config/kitty/sessions

map ctrl+page_up previous_tab
map ctrl+page_down next_tab

# Window management
map ctrl+shift+t new_tab_with_cwd
enabled_layouts splits
map f7 launch --cwd=current --location=hsplit
map f6 launch --cwd=current --location=vsplit

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

